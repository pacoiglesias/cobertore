# Despliegue automático de cobertores.com (repo cobertore)
#
# BORRADOR — ruta final en el repo: .github/workflows/deploy.yml
# (lo tiene que meter Paco: el conector de GitHub de Muse no tiene
#  permiso de Workflows y no puede crear/editar archivos .github/workflows/).
#
# Modelo: .github/workflows/deploy.yml de Alacena (push a main, WIF,
# firebase CLI directo), con una diferencia: Cobertores despliega SOLO
# Hosting al proyecto cobertores-web. No hay Functions que desplegar
# (el deploy es --only hosting aunque firebase.json tenga bloque functions).
#
# Lección de Fotos (6 nov 2026, run 42331872002): NO usar la API de Node
# de firebase-tools (scripts/firebase-runner.cjs) en CI: no resuelve las
# credenciales WIF (external_account) y el deploy falla con
# "Failed to authenticate". El binario CLI de Firebase SÍ toma las
# credenciales ADC que deja el paso WIF (Alacena despliega en verde así).
# Por eso este workflow usa `firebase deploy` directo.
#
# El build de Next lee Firestore system_settings/global en tiempo de
# build (seoTitle/seoDescription), así que el título nuevo entra en vivo
# con el primer despliegue tras actualizar Firestore (hecho 6 nov 21:52).
#
# Placeholders ya rellenados (verificados en Firebase Console 6 nov 2026):
#   - 406682059694 = nº de proyecto GCP de cobertores-web
# El pool/provider viven en cobertores-web; la service account es
# cobertores-deploy@cobertores-web.iam.gserviceaccount.com.

name: Desplegar Cobertores

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # obligatorio para WIF (google-github-actions/auth)

concurrency:
  group: cobertores-deploy
  cancel-in-progress: false # nunca cancelar un despliegue a medias

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_NUMBER: '406682059694'
      WIF_PROVIDER: 'projects/406682059694/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
      WIF_SERVICE_ACCOUNT: 'cobertores-deploy@cobertores-web.iam.gserviceaccount.com'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20' # igual que ci.yml
          cache: npm

      - name: Autenticar en GCP con WIF (sin secretos)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools@15.26.0

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar y construir
        run: |
          npm run lint
          npm run build

      - name: Desplegar Hosting
        run: firebase deploy --only hosting --project cobertores-web --non-interactive

      - name: Verificar título nuevo en vivo
        run: |
          set -euo pipefail
          BODY="$(curl -fsSL --max-time 15 https://cobertores.com/)"
          echo "$BODY" | grep -q "Fábrica Textil en Tlaxcala desde 1962" || { echo "Título nuevo no encontrado en vivo"; exit 1; }
          echo "VERIFICADO https://cobertores.com título nuevo"
